name: Validate orbit.nvim

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Release runs test the tagged commit with full ancestry.
          fetch-depth: 0

      - name: Install Neovim
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/neovim/neovim/releases/download/v0.12.5'
          if ($IsWindows) {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
            Invoke-WebRequest "$base/nvim-win64.zip" -OutFile $archive
            $expected = 'de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-win64/bin'
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64.tar.gz'
            Invoke-WebRequest "$base/nvim-linux-x86_64.tar.gz" -OutFile $archive
            $expected = 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            tar -xzf $archive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Neovim extraction failed' }
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64/bin'
          }
          $binaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify Neovim installation
        run: |
          nvim --version
          if ($LASTEXITCODE -ne 0) { throw 'Neovim installation failed' }

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.51.0'

      - name: Check the schema and saved settings
        run: |
          just schema
          if ($LASTEXITCODE -ne 0) { throw 'Schema checks failed' }

      - name: Run the offline test suites
        run: |
          # Temporary diagnostic: compare original combined bars with statusline-only ownership.
          $original = Join-Path $env:RUNNER_TEMP 'statusline-spec-original.lua'
          Copy-Item tests/statusline_spec.lua $original
          $runner = Join-Path $env:RUNNER_TEMP 'test-runner-original.lua'
          Copy-Item scripts/test.lua $runner
          (Get-Content scripts/test.lua -Raw).Replace('}):wait()', '}):wait(5000)') | Set-Content -NoNewline scripts/test.lua
          $baseline = git show 8c13660:tests/statusline_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fixture read failed' }
          $baseline | Set-Content tests/statusline_spec.lua
          $baselineFailures = 0
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            just test statusline
            if ($LASTEXITCODE -ne 0) { $baselineFailures++ }
          }
          Copy-Item $original tests/statusline_spec.lua
          $candidateFailures = 0
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            just test statusline
            if ($LASTEXITCODE -ne 0) { $candidateFailures++ }
          }
          Copy-Item $runner scripts/test.lua
          Write-Output "STATUSLINE_DIAGNOSTIC baseline_failures=$baselineFailures candidate_failures=$candidateFailures"
          if ($candidateFailures -ne 0) { throw 'Candidate statusline fixture crashed' }
          just test
          if ($LASTEXITCODE -ne 0) { throw 'Offline test suites failed' }

      - name: Check tracked source is unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tests changed tracked files' }
