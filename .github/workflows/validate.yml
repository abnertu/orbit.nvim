name: Validate orbit.nvim

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/neovim/neovim/releases/download/v0.12.5'
          if ($IsWindows) {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
            Invoke-WebRequest "$base/nvim-win64.zip" -OutFile $archive
            $expected = 'de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-win64/bin'
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64.tar.gz'
            Invoke-WebRequest "$base/nvim-linux-x86_64.tar.gz" -OutFile $archive
            $expected = 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            tar -xzf $archive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Neovim extraction failed' }
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64/bin'
          }
          $binaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify Neovim installation
        run: |
          nvim --version
          if ($LASTEXITCODE -ne 0) { throw 'Neovim installation failed' }

      - name: Check generated schema
        run: |
          nvim --headless -u NONE -l scripts/generate_schema.lua --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated schema is stale' }

      - name: Test schema contracts
        run: |
          nvim --headless -u NONE -l tests/schema_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Lua schema contracts failed' }

      - name: Test saved settings input
        run: |
          nvim --headless -u NONE -l tests/settings_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Lua saved settings tests failed' }

      - name: Test transactional module setup
        run: |
          nvim --headless -u NONE -l tests/lifecycle_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Module lifecycle tests failed' }

      - name: Test explicit settings reload
        run: |
          nvim --headless -u NONE -l tests/reload_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Explicit settings reload tests failed' }

      - name: Test restart-only settings lifecycle
        run: |
          nvim --headless -u NONE -l tests/restart_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Restart-only settings tests failed' }

      - name: Test opt-in settings observation
        run: |
          nvim --headless -u NONE -l tests/watch_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Settings observer tests failed' }

      - name: Test configurable filetype detection
        run: |
          nvim --headless -u NONE -l tests/filetypes_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Filetype module tests failed' }

      - name: Test settings command lifecycle
        run: |
          nvim --headless -u NONE -l tests/commands_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Settings command tests failed' }

      - name: Test core event lifecycle
        run: |
          nvim --headless -u NONE -l tests/events_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Core event tests failed' }

      - name: Test core window keymaps
        run: |
          nvim --headless -u NONE -l tests/corekeys_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Core keymap tests failed' }

      - name: Test on-demand plugin loader
        run: |
          nvim --headless -u NONE -l tests/plugins_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Plugin demand tests failed' }

      - name: Test locked Lazy bootstrap with local Git
        run: |
          nvim --headless -u NONE -l tests/bootstrap_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Locked Lazy bootstrap tests failed' }

      - name: Test manifest-backed Lazy feature specs
        run: |
          nvim --headless -u NONE -l tests/icons_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Lazy icon feature spec tests failed' }

      - name: Test one-shot FilePost event
        run: |
          nvim --headless -u NONE -l tests/filepost_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'FilePost event tests failed' }

      - name: Test gitsigns feature specs
        run: |
          nvim --headless -u NONE -l tests/git_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'gitsigns feature specs failed' }

      - name: Test first-demand Lazy startup with locked local Git
        run: |
          nvim --headless -u NONE -l tests/plugins_integration_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Integrated Lazy startup tests failed' }

      - name: Test editor plugin specifications
        run: |
          nvim --headless -u NONE -l tests/editor_plugins_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Editor plugin tests failed' }

      - name: Test diagnostics feature callbacks
        run: |
          nvim --headless -u NONE -l tests/diagnostics_plugins_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics plugin tests failed' }

      - name: Test Snacks callbacks and redraw guard
        run: |
          nvim --headless -u NONE -l tests/snacks_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Snacks feature tests failed' }

      - name: Test Mason lazy command owner
        run: |
          nvim --headless -u NONE -l tests/mason_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Mason manager tests failed' }

      - name: Test Tree-sitter parser and autotag callbacks
        run: |
          nvim --headless -u NONE -l tests/treesitter_plugins_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Tree-sitter spec tests failed' }

      - name: Test Conform formatting owner
        run: |
          nvim --headless -u NONE -l tests/formatter_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Formatting feature tests failed' }

      - name: Test nvim-lint scheduling lifecycle
        run: |
          nvim --headless -u NONE -l tests/linter_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Linter runtime tests failed' }

      - name: Reject old runtime names
        run: |
          nvim --headless -u NONE -l scripts/check_legacy_names.lua
          if ($LASTEXITCODE -ne 0) { throw 'Legacy names found' }

      - name: Test Neovim startup and module behavior
        run: |
          nvim --headless -u NONE --cmd "set rtp^=." -l tests/smoke.lua
          if ($LASTEXITCODE -ne 0) { throw 'Neovim smoke test failed' }

      - name: Check tracked source is unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tests changed tracked files' }
