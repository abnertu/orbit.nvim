name: Validate real upstream plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-icons:
    name: Live mini.icons on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/neovim/neovim/releases/download/v0.12.5'
          if ($IsWindows) {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
            Invoke-WebRequest "$base/nvim-win64.zip" -OutFile $archive
            $expected = 'de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-win64/bin'
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64.tar.gz'
            Invoke-WebRequest "$base/nvim-linux-x86_64.tar.gz" -OutFile $archive
            $expected = 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875'
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Neovim archive checksum mismatch' }
            tar -xzf $archive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Neovim extraction failed' }
            $binaryDirectory = Join-Path $env:RUNNER_TEMP 'nvim-linux-x86_64/bin'
          }
          $binaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify Neovim installation
        run: |
          nvim --version
          if ($LASTEXITCODE -ne 0) { throw 'Neovim installation failed' }

      - name: Run pinned real mini.icons integration
        run: |
          nvim --headless -u NONE -l tests/live_icons_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real mini.icons integration failed' }

      - name: Run pinned real gitsigns attach and hunk integration
        run: |
          nvim --headless -u NONE -l tests/live_gitsigns_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real gitsigns integration failed' }

      - name: Run pinned real LuaSnip T-SQL expansion integration
        run: |
          nvim --headless -u NONE -l tests/live_tsql_snippets_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real LuaSnip T-SQL integration failed' }

      - name: Run pinned real which-key guide integration
        run: |
          nvim --headless -u NONE -l tests/live_keyguide_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real which-key integration failed' }

      - name: Run pinned real Obsidian vault integration
        run: |
          nvim --headless -u NONE -l tests/live_obsidian_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Obsidian vault integration failed' }

      - name: Run pinned real Noice message activation integration
        run: |
          nvim --headless -u NONE -l tests/live_noice_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Noice integration failed' }

      - name: Install verified Tree-sitter CLI for grammar compilation
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v0.27.1'
          $base = "https://github.com/tree-sitter/tree-sitter/releases/download/$version"
          if ($IsWindows) {
            $archiveName = 'tree-sitter-cli-windows-x64.zip'
            $expected = 'de043e4c289efcef7981df99988300f23763befdeb36abf7c1898f080c478424'
            $binaryName = 'tree-sitter.exe'
          } else {
            $archiveName = 'tree-sitter-cli-linux-x64.zip'
            $expected = 'c7e686aec16ba17053c2e6fd87600ccb10cf8ba3d055756b17e756d538e11114'
            $binaryName = 'tree-sitter'
          }
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest "$base/$archiveName" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Tree-sitter CLI archive checksum mismatch'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'pinned-tree-sitter-cli'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $binary = Get-ChildItem -Path $extract -Recurse -File |
            Where-Object { $_.Name -eq $binaryName } |
            Select-Object -First 1
          if (-not $binary) { throw 'Tree-sitter CLI binary missing from verified release' }
          if (-not $IsWindows) { chmod +x $binary.FullName }
          & $binary.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Tree-sitter CLI preflight failed' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run pinned C-sharp and SQL Tree-sitter parser integration
        run: |
          nvim --headless -u NONE -l tests/live_treesitter_sql_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Tree-sitter SQL injection integration failed' }

      - name: Run pinned real nvim-dap TCP protocol integration
        run: |
          nvim --headless -u NONE -l tests/live_dap_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real nvim-dap integration failed' }

      - name: Run pinned real Hangar state and tool ordering integration
        run: |
          nvim --headless -u NONE -l tests/live_hangar_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Hangar persistence integration failed' }

      - name: Run pinned real Hangar and NUI view lifecycle
        run: |
          nvim --headless -u NONE -l tests/live_hangar_ui_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Hangar/NUI UI lifecycle failed' }

      - name: Run pinned real nvim-lint diagnostic integration
        run: |
          nvim --headless -u NONE -l tests/live_lint_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real nvim-lint integration failed' }

      - name: Run pinned real Conform formatter integration
        run: |
          nvim --headless -u NONE -l tests/live_conform_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Conform integration failed' }

      - name: Run pinned real Trouble diagnostics integration
        run: |
          nvim --headless -u NONE -l tests/live_trouble_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Trouble integration failed' }

      - name: Run pinned real Harpoon navigation integration
        run: |
          nvim --headless -u NONE -l tests/live_harpoon_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real Harpoon integration failed' }

      - name: Run pinned real native dashboard and explorer startup
        run: |
          nvim --headless -u NONE -l tests/live_startup_ui_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real dashboard/explorer startup integration failed' }

      - name: Run pinned real context-menu input and lifecycle
        run: |
          nvim --headless -u NONE -l tests/live_menu_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real context-menu input integration failed' }

      - name: Run pinned real completion input and Escape cleanup
        run: |
          nvim --headless -u NONE -l tests/live_completion_escape_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real completion/Escape integration failed' }

      - name: Run pinned real commandline completion and Noice ownership
        run: |
          nvim --headless -u NONE -l tests/live_cmdline_completion_spec.lua
          if ($LASTEXITCODE -ne 0) { throw 'Real commandline completion integration failed' }
